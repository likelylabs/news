name: build-news-index

# The deterministic half of the pipeline (tenet #5, "one sanctioned write
# path"). The news automation only writes article files + ledger.json; this
# Action normalizes safe metadata, validates every article, rebuilds the
# ledger, and regenerates index.json. An unrepairable article is QUARANTINED:
# left out of the index (file untouched) while every other article publishes,
# and the run still ends red with an annotation naming the file, so one
# writer slip can't stall the whole feed. More than MAX_QUARANTINED bad files
# at once (tools/build_index.py) falls back to the old strict failure.
# Article files are never deleted.

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'ledger.json'
      - 'tools/**'
      - 'schema/**'
      - 'tests/**'
      - '.github/workflows/build-index.yml'
  pull_request:
    paths:
      - 'articles/**'
      - 'tools/**'
      - 'schema/**'
      - 'tests/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch: {}
  schedule:
    # Daily rebuild so stale index entries/ledger keys age out on quiet days.
    - cron: '30 20 * * *'

permissions:
  contents: read

# No `concurrency` group, on purpose. With one, GitHub keeps a single
# PENDING run per group and cancels the rest, so a burst of pushes (an
# article commit plus the automation's quick follow-up fixes) showed up as
# "cancelled" runs. Overlapping runs are safe without it: see the retry loop.

jobs:
  validate:
    if: github.event_name == 'pull_request'
    # Pinned, not ubuntu-latest: the jump to 26.04 (Nov 2026) brought a newer
    # Python whose datetime parsing differed and stalled every build. Bump
    # deliberately, after running tests/ on the new image's Python.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check articles without writing files
        run: python3 tools/build_index.py --check

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Pinned, not ubuntu-latest: the jump to 26.04 (Nov 2026) brought a newer
    # Python whose datetime parsing differed and stalled every build. Bump
    # deliberately, after running tests/ on the new image's Python.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write   # dispatch pages-deploy after a self-heal build (below)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Prune + rebuild + push, retried against a moving main.
      #
      # Other runs of this workflow and the news automation both push to main.
      # A run that checks out at commit A while someone pushes commit B gets
      # "cannot lock ref 'refs/heads/main'" (or "fetch first").
      #
      # index.json is 100% derived from the article files, so there is nothing
      # to merge: on a rejected push we throw our commit away, hard-reset to the
      # new tip, and recompute from that tree. Only a push built on the current
      # tip can land (no force), so whatever lands is correct by construction.
      # The backoff is jittered so overlapping runs don't collide in lockstep.
      #
      # Test and build_index.py failures are NOT retried — the shell's -e
      # aborts the run immediately and leaves the live index untouched.
      # build_index.py exit 3 means "published, but quarantined some files":
      # we still commit and push, then the next step turns the run red.
      # The ledger is dedup memory only (never read by the app), so a
      # prune.py problem is a warning, never a reason to stall the index.
      - name: Prune, validate, rebuild index.json, and commit
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            # Each attempt rebuilds from a fresh tip; only the last one counts.
            rm -f "$RUNNER_TEMP/quarantine.txt"
            python3 -m unittest discover -s tests -v
            if ! python3 tools/prune.py; then
              echo "::warning title=Ledger rebuild failed::tools/prune.py failed; publishing the index anyway."
              git checkout -- ledger.json 2>/dev/null || true
            fi

            status=0
            python3 tools/build_index.py --quarantine 2> build-errors.txt || status=$?
            cat build-errors.txt >&2
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            if [ "$status" -eq 3 ]; then
              mv build-errors.txt "$RUNNER_TEMP/quarantine.txt"
            else
              rm -f build-errors.txt
            fi

            if [ -z "$(git status --porcelain)" ]; then
              echo "Nothing to commit — index already current."
              exit 0
            fi

            git add -A
            git commit -m "chore(index): rebuild index + prune [skip ci]"

            if git push; then
              exit 0
            fi

            echo "::notice::push rejected on attempt ${attempt}/8 — main moved under us (the news automation pushed mid-build). Resetting and recomputing."
            git fetch origin main
            git reset --hard origin/main
            sleep $(( attempt * 3 + RANDOM % 5 ))
          done

          echo "::error::could not land the regenerated index after 8 attempts — main is being pushed to faster than the index can be rebuilt."
          exit 1

      # pages-deploy normally starts on workflow_run when this workflow
      # completes. But GitHub does not fire workflow_run for a run started
      # with the built-in GITHUB_TOKEN, which is how pages-deploy's 30-min
      # reconcile starts this build. On 2026-11-11 that left a rebuilt index
      # on main undeployed for 30 min until an external watchdog deployed it.
      # workflow_dispatch is exempt from that rule, so dispatch the deploy
      # directly. Placed before the quarantine check so it runs even when
      # that check turns the run red.
      - name: Deploy after a self-heal build
        if: github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      # Runs only after the good articles are pushed. Annotates each bad file
      # on the commit and fails the run so the problem stays visible.
      # pages-deploy deploys after a failed build too, so the published
      # articles still go live right away.
      #
      # Grace period first: the automation sometimes pushes PLACEHOLDER files
      # and replaces them about a minute later (56-76s every time so far).
      # If a newer commit on main makes every quarantined file pass the real
      # validator (build_index.py run on that commit, not just a JSON parse:
      # a parseable file with a bad category once slipped through for two
      # days), that push triggers its own build, which publishes them — so
      # this run passes with a notice instead of raising a false alarm.
      - name: Fail on quarantined articles
        run: |
          [ -f "$RUNNER_TEMP/quarantine.txt" ] || { echo "No quarantined articles."; exit 0; }
          bad_files() {  # $1 = build_index stderr, $2 = repo root to strip
            sed -n 's/^  - //p' "$1" | sed 's/: .*//' | sed "s|^$2/||" | sort -u
          }
          bad_files "$RUNNER_TEMP/quarantine.txt" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bad.txt"
          built="$(git rev-parse HEAD)"
          tip="$RUNNER_TEMP/tip"
          for i in $(seq 1 18); do
            sleep 10
            git fetch -q origin main || continue
            # Nothing newer than what we built (our own [skip ci] commit
            # aside) means nothing can have fixed the files yet.
            git diff --quiet "$built" origin/main -- articles && continue
            rm -rf "$tip" && mkdir -p "$tip"
            git archive origin/main articles tools | tar -x -C "$tip"
            python3 "$tip/tools/build_index.py" --quarantine > /dev/null 2> "$RUNNER_TEMP/tip.err" || true
            bad_files "$RUNNER_TEMP/tip.err" "$tip" > "$RUNNER_TEMP/tip-bad.txt"
            if [ -z "$(comm -12 "$RUNNER_TEMP/bad.txt" "$RUNNER_TEMP/tip-bad.txt")" ]; then
              echo "::notice title=Quarantine cleared::a later push ($(git rev-parse --short origin/main)) fixed every quarantined file; its build publishes them."
              exit 0
            fi
          done
          {
            echo "## Quarantined articles"
            echo "These files were left out of index.json. Everything else was published."
            echo "Fix each file (or re-push it) and the next build picks it up."
            echo '```'
            cat "$RUNNER_TEMP/quarantine.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^  - ' "$RUNNER_TEMP/quarantine.txt" | sed 's/^  - //' | while IFS= read -r line; do
            file="${line%%: *}"
            file="${file#"$GITHUB_WORKSPACE/"}"
            echo "::error file=${file},title=Article quarantined::${line#*: }"
          done
          exit 1
